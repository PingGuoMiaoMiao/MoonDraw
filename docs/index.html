<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MoonDraw — 用 MoonBit 写的流程图 / 白板编辑器，纯前端，离线可用。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
    <title>MoonDraw · MoonBit 流程图白板</title>
    <style>
/* MoonDraw — Geist-style shell: rail / canvas / panel / status bar. */

:root {
  --bg: #ffffff;
  --wash: #fafafa;
  --wash-2: #f5f5f5;
  --border: #eaeaea;
  --border-strong: #d4d4d4;
  --text: #171717;
  --muted: #666666;
  --faint: #8f8f8f;
  --blue: #0070f3;
  --blue-wash: #ebf5ff;
  --red: #e2162a;
  --radius: 6px;
  --radius-lg: 8px;
  --ring: 0 0 0 1px rgba(0, 0, 0, 0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --top: 48px;
  --bottom: 38px;
  --rail: 64px;
  --panel: 236px;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ---------------------------------------------------------------- top bar */
.topbar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  height: var(--top);
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 2px;
}

.mark {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: var(--text);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.chip {
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--wash);
  color: var(--faint);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 15px;
}

.group {
  display: flex;
  align-items: center;
  gap: 1px;
}

.ghost {
  height: 28px;
  padding: 0 9px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}

.ghost:hover {
  background: var(--wash-2);
  color: var(--text);
}

.ghost.danger:hover {
  background: #fef2f2;
  color: var(--red);
}

.select {
  height: 28px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.select:hover {
  color: var(--text);
  border-color: var(--border-strong);
}

.sep {
  width: 1px;
  height: 16px;
  background: var(--border);
}

.spacer {
  flex: 1;
}

/* --------------------------------------------------------------- work row */
.work {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
}

/* tool rail */
.rail {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  gap: 2px;
  width: var(--rail);
  padding: 8px 6px;
  border-right: 1px solid var(--border);
  background: var(--bg);
  overflow-y: auto;
  scrollbar-width: none;
}

.rail::-webkit-scrollbar {
  display: none;
}

.rail-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  height: 46px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 10.5px;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.rail-btn .ico {
  font-size: 15px;
  line-height: 1;
}

.rail-btn:hover {
  background: var(--wash);
  color: var(--text);
}

.rail-btn.active {
  border-color: var(--border);
  background: var(--wash-2);
  color: var(--text);
}

/* canvas */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  background: var(--wash);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: default;
}

body[data-tool="rect"] canvas,
body[data-tool="round"] canvas,
body[data-tool="diamond"] canvas,
body[data-tool="ellipse"] canvas,
body[data-tool="edge"] canvas {
  cursor: crosshair;
}

body[data-tool="hand"] canvas {
  cursor: grab;
}

body[data-tool="text"] canvas {
  cursor: text;
}

.empty {
  position: absolute;
  inset: 0;
  display: none;
  place-content: center;
  gap: 6px;
  text-align: center;
  pointer-events: none;
}

.empty-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.empty-sub {
  font-size: 12px;
  color: var(--faint);
}

.empty kbd {
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translate(-50%, 6px);
  padding: 6px 10px;
  border-radius: var(--radius);
  background: var(--text);
  color: #fff;
  font-family: var(--mono);
  font-size: 11px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ----------------------------------------------------------- right panel */
.panel {
  display: flex;
  flex: 0 0 auto;
  flex-direction: column;
  width: var(--panel);
  border-left: 1px solid var(--border);
  background: var(--bg);
  overflow-y: auto;
}

.panel-head {
  position: sticky;
  top: 0;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.panel-body {
  padding: 4px 0 16px;
}

.panel-empty {
  margin: 0;
  padding: 16px 14px;
  color: var(--faint);
  font-size: 12px;
}

.panel-sec {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}

.panel-sec:last-child {
  border-bottom: 0;
}

.panel-sec h4 {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 500;
  color: var(--faint);
  letter-spacing: 0.02em;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 8px;
}

.grid2 label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--faint);
  font-size: 11px;
}

input[type="number"],
input[type="text"] {
  width: 100%;
  min-width: 0;
  height: 26px;
  padding: 0 7px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11.5px;
  outline: none;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

input[type="number"]:hover,
input[type="text"]:hover {
  border-color: var(--border-strong);
}

input[type="number"]:focus,
input[type="text"]:focus {
  border-color: var(--text);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
}

.wide {
  width: 100%;
}

.row {
  display: flex;
  gap: 14px;
}

.swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--faint);
  font-size: 11px;
  cursor: pointer;
}

.swatch input[type="color"] {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: none;
  cursor: pointer;
}

.swatch input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 2px;
}

.swatch input[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: 3px;
}

.panel-value {
  margin: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
}

/* -------------------------------------------------------------- bottom bar */
.bottombar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
  height: var(--bottom);
  padding: 0 10px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  overflow: hidden;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 100%;
  padding: 0;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--faint);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.12s ease, border-color 0.12s ease;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--text);
  font-weight: 500;
  border-bottom-color: var(--text);
}

.tab .label {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
}

.tab .close {
  display: grid;
  place-items: center;
  width: 13px;
  height: 13px;
  border-radius: 3px;
  color: var(--faint);
  font-size: 11px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.tab:hover .close,
.tab.active .close {
  opacity: 1;
}

.tab .close:hover {
  background: #fee2e2;
  color: var(--red);
}

.tab-add {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--faint);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}

.tab-add:hover {
  border-color: var(--border);
  background: var(--wash);
  color: var(--text);
}

.hint {
  margin-right: 12px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40vw;
}

.zoom {
  display: flex;
  align-items: center;
  gap: 1px;
}

.zbtn {
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}

.zbtn:hover {
  background: var(--wash-2);
  color: var(--text);
}

.zbtn.wide {
  width: auto;
  padding: 0 8px;
  font-size: 11.5px;
}

.zval {
  min-width: 44px;
  height: 22px;
  padding: 0 4px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
}

.zval:hover {
  background: var(--wash-2);
  color: var(--text);
}

/* IME-safe inline text editor, floated above the canvas */
#inline-editor {
  position: fixed;
  z-index: 10;
  display: none;
  min-width: 80px;
  padding: 3px 7px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  font-family: var(--font);
  line-height: 1.25;
  text-align: center;
  resize: none;
  outline: none;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1), var(--ring);
}

/* narrow windows: shed chrome instead of clipping */
@media (max-width: 1180px) {
  .ghost[data-action="dist-h"],
  .ghost[data-action="dist-v"],
  .ghost[data-action="mermaid"] {
    display: none;
  }

  .hint {
    display: none;
  }
}

@media (max-width: 940px) {
  :root {
    --panel: 0px;
  }

  .panel {
    display: none;
  }

  .chip,
  .ghost[data-action="demo"] {
    display: none;
  }
}

</style>
  </head>
  <body data-tool="select">
    <div class="app">
      <!-- ------------------------------------------------------------ top -->
      <header class="topbar">
        <div class="brand">
          <span class="mark">M</span>
          <span class="name">MoonDraw</span>
          <span class="chip">v0.1</span>
        </div>

        <span class="sep"></span>

        <div class="group">
          <button class="ghost" data-action="open" title="打开 .moondraw / Mermaid 文件">打开</button>
          <button class="ghost" data-action="saveFile" title="保存为 .moondraw 文件">保存</button>
          <select id="export-range" class="select" title="导出范围">
            <option value="all">整图</option>
            <option value="selection">选区</option>
            <option value="viewport">视口</option>
          </select>
          <button class="ghost" data-action="svg" title="导出 SVG">SVG</button>
          <button class="ghost" data-action="png" title="导出 PNG">PNG</button>
        </div>

        <span class="sep"></span>

        <div class="group">
          <button class="ghost" data-action="undo" title="撤销 (Ctrl+Z)">撤销</button>
          <button class="ghost" data-action="redo" title="重做 (Ctrl+Shift+Z)">重做</button>
          <button class="ghost" data-action="dist-h" title="横向等间距（需选中 3+ 图形）">横分布</button>
          <button class="ghost" data-action="dist-v" title="纵向等间距（需选中 3+ 图形）">纵分布</button>
        </div>

        <span class="spacer"></span>

        <div class="group">
          <button class="ghost" data-action="mermaid" title="导入示例 Mermaid 流程图">Mermaid</button>
          <button class="ghost" data-action="demo" title="载入示例">示例</button>
          <button class="ghost danger" data-action="clear" title="清空画布">清空</button>
        </div>
      </header>

      <!-- ----------------------------------------------------------- work -->
      <div class="work">
        <aside class="rail" role="group" aria-label="工具">
          <button class="rail-btn active" data-tool="select" title="选择 (V)">
            <span class="ico">↖</span><span class="lbl">选择</span>
          </button>
          <button class="rail-btn" data-tool="rect" title="矩形 (R)">
            <span class="ico">▭</span><span class="lbl">矩形</span>
          </button>
          <button class="rail-btn" data-tool="round" title="圆角矩形 (U)">
            <span class="ico">▢</span><span class="lbl">圆角</span>
          </button>
          <button class="rail-btn" data-tool="diamond" title="菱形 (D)">
            <span class="ico">◇</span><span class="lbl">菱形</span>
          </button>
          <button class="rail-btn" data-tool="ellipse" title="椭圆 (O)">
            <span class="ico">◯</span><span class="lbl">椭圆</span>
          </button>
          <button class="rail-btn" data-tool="text" title="文本 (T)">
            <span class="ico">T</span><span class="lbl">文本</span>
          </button>
          <button class="rail-btn" data-tool="edge" title="连线 (L)">
            <span class="ico">→</span><span class="lbl">连线</span>
          </button>
          <button class="rail-btn" data-tool="hand" title="平移 (H)">
            <span class="ico">✋</span><span class="lbl">平移</span>
          </button>
        </aside>

        <main class="stage">
          <canvas id="board"></canvas>
          <div class="empty" id="empty-state">
            <div class="empty-title">空白画布</div>
            <div class="empty-sub">从左侧选一个工具拖拽绘制，或点击 <kbd>示例</kbd></div>
          </div>
          <div id="status" class="toast"></div>
        </main>

        <aside class="panel" aria-label="属性">
          <div class="panel-head">属性</div>
          <div class="panel-body">
            <p class="panel-empty" id="panel-empty">未选中对象</p>

            <section class="panel-sec" id="panel-geom">
              <h4>位置与尺寸</h4>
              <div class="grid2">
                <label>X <input id="p-x" type="number" step="1" /></label>
                <label>Y <input id="p-y" type="number" step="1" /></label>
                <label>宽 <input id="p-w" type="number" step="1" min="8" /></label>
                <label>高 <input id="p-h" type="number" step="1" min="8" /></label>
              </div>
            </section>

            <section class="panel-sec" id="panel-paint">
              <h4>外观</h4>
              <div class="row">
                <label class="swatch" title="填充">
                  <input id="p-fill" type="color" /><span>填充</span>
                </label>
                <label class="swatch" title="描边">
                  <input id="p-stroke" type="color" /><span>描边</span>
                </label>
              </div>
            </section>

            <section class="panel-sec" id="panel-text">
              <h4>文本</h4>
              <input id="p-text" type="text" class="wide" placeholder="双击图形也可编辑" />
            </section>

            <section class="panel-sec" id="panel-kind">
              <h4>类型</h4>
              <p class="panel-value" id="p-kind">—</p>
            </section>
          </div>
        </aside>
      </div>

      <!-- --------------------------------------------------------- bottom -->
      <footer class="bottombar">
        <div class="tabs" id="tabs"></div>
        <button class="tab-add" id="tab-add" title="新建文档 (Ctrl+T)" aria-label="新建文档">+</button>

        <span class="spacer"></span>

        <span class="hint" id="hud-hint">拖拽移动 · 滚轮缩放 · 双击改文字</span>

        <div class="zoom">
          <button class="zbtn" data-action="zoom-out" title="缩小">−</button>
          <button class="zval" data-action="zoom-reset" id="hud-zoom" title="重置为 100%">100%</button>
          <button class="zbtn" data-action="zoom-in" title="放大">+</button>
          <button class="zbtn wide" data-action="fit" title="适配视图 (F)">适配</button>
        </div>
      </footer>
    </div>

    <script>
      const tools = Array.from(document.querySelectorAll(".rail [data-tool]"));
      const setActiveTool = (name) => {
        document.body.dataset.tool = name;
        tools.forEach((b) => b.classList.toggle("active", b.dataset.tool === name));
      };

      tools.forEach((btn) => {
        btn.addEventListener("click", () => {
          ui_set_tool(btn.dataset.tool);
          setActiveTool(btn.dataset.tool);
        });
      });

      boot();

      // ---------------------------------------------------------- tabs
      const tabsEl = document.getElementById("tabs");
      function renderTabs() {
        const data = JSON.parse(ui_docs_json());
        tabsEl.textContent = "";
        data.docs.forEach((d, i) => {
          const tab = document.createElement("button");
          tab.className = "tab" + (i === data.active ? " active" : "");
          tab.title = "点击切换 · 双击重命名";

          const label = document.createElement("span");
          label.className = "label";
          label.textContent = d.name;
          tab.appendChild(label);

          const close = document.createElement("span");
          close.className = "close";
          close.textContent = "×";
          close.title = "关闭";
          close.addEventListener("click", (e) => {
            e.stopPropagation();
            ui_close_doc(i);
            renderTabs();
          });
          tab.appendChild(close);

          tab.addEventListener("click", () => {
            ui_switch_doc(i);
            renderTabs();
          });
          tab.addEventListener("dblclick", (e) => {
            e.stopPropagation();
            const name = prompt("重命名文档", d.name);
            if (name) {
              ui_rename_doc(name);
              renderTabs();
            }
          });
          tabsEl.appendChild(tab);
        });
      }
      document.getElementById("tab-add").addEventListener("click", () => {
        ui_new_doc();
        renderTabs();
      });
      renderTabs();
      window.addEventListener("focus", renderTabs);

      // ------------------------------------------------- property panel
      const panel = {
        empty: document.getElementById("panel-empty"),
        geom: document.getElementById("panel-geom"),
        paint: document.getElementById("panel-paint"),
        text: document.getElementById("panel-text"),
        kind: document.getElementById("panel-kind"),
        x: document.getElementById("p-x"),
        y: document.getElementById("p-y"),
        w: document.getElementById("p-w"),
        h: document.getElementById("p-h"),
        fill: document.getElementById("p-fill"),
        stroke: document.getElementById("p-stroke"),
        label: document.getElementById("p-text"),
        kindText: document.getElementById("p-kind"),
      };

      let lastPanelJson = null;
      window.applyPanel = function (json) {
        if (json === lastPanelJson) return;
        lastPanelJson = json;
        const active = document.activeElement;
        if (active && panel.geom.parentElement.contains(active)) return; // don't fight typing

        const data = json === "null" ? null : JSON.parse(json);
        const show = (el, on) => {
          el.style.display = on ? "" : "none";
        };
        if (!data) {
          panel.empty.style.display = "";
          show(panel.geom, false);
          show(panel.paint, false);
          show(panel.text, false);
          show(panel.kind, false);
          return;
        }
        panel.empty.style.display = "none";
        const single = data.kind !== "multi" && data.kind !== "edge";
        show(panel.geom, single);
        show(panel.paint, single);
        show(panel.text, single);
        show(panel.kind, true);
        if (single) {
          panel.x.value = data.x;
          panel.y.value = data.y;
          panel.w.value = data.w;
          panel.h.value = data.h;
          panel.fill.value = data.fill || "#ffffff";
          panel.stroke.value = data.stroke || "#d4d4d4";
          panel.label.value = data.text || "";
        } else if (data.kind === "multi") {
          panel.label.value = "";
        }
        panel.kindText.textContent =
          data.kind === "multi" ? `已选中 ${data.count} 个图形` :
          data.kind === "edge" ? `连线${data.label ? "：" + data.label : ""}` :
          data.kind;
      };

      const commitGeom = (field, el) => () => {
        const v = parseFloat(el.value);
        if (!Number.isNaN(v)) ui_set_geom(field, v);
      };
      panel.x.addEventListener("change", commitGeom("x", panel.x));
      panel.y.addEventListener("change", commitGeom("y", panel.y));
      panel.w.addEventListener("change", commitGeom("w", panel.w));
      panel.h.addEventListener("change", commitGeom("h", panel.h));
      panel.fill.addEventListener("input", () => ui_set_paint("fill", panel.fill.value));
      panel.stroke.addEventListener("input", () => ui_set_paint("stroke", panel.stroke.value));
      panel.label.addEventListener("change", () => ui_set_shape_text(panel.label.value));

      // ------------------------------------------------------- actions
      const exportRange = () => document.getElementById("export-range").value;
      const SAMPLE_MERMAID = [
        "flowchart TD",
        "  A[上报工单] --> B{是否P1}",
        "  B -->|是| C(立即响应)",
        "  B -->|否| D{是否重复}",
        "  D -->|是| E(合并到已有工单)",
        "  D -->|否| F(排期处理)",
        "  C --> G((结单))",
        "  F --> G",
      ].join("\n");

      const actions = {
        undo: () => ui_undo(),
        redo: () => ui_redo(),
        fit: () => ui_fit(),
        "dist-h": () => ui_distribute_h(),
        "dist-v": () => ui_distribute_v(),
        open: () => {
          ui_open_file();
          setTimeout(renderTabs, 900);
        },
        saveFile: () => ui_save_file(),
        svg: () => ui_export_svg(exportRange()),
        png: () => ui_export_png(exportRange()),
        mermaid: () => ui_import_mermaid(SAMPLE_MERMAID),
        demo: () => ui_demo(),
        clear: () => ui_clear(),
        "zoom-in": () => ui_zoom(1.2),
        "zoom-out": () => ui_zoom(1 / 1.2),
        "zoom-reset": () => ui_zoom_reset(),
      };
      document.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => actions[btn.dataset.action]?.());
      });

      const toolKeys = {
        v: "select", r: "rect", u: "round", d: "diamond",
        o: "ellipse", t: "text", l: "edge", h: "hand",
      };
      window.addEventListener("keydown", (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && ["z", "y", "s", "t", "w"].includes(e.key.toLowerCase())) e.preventDefault();
        if (mod) {
          const k = e.key.toLowerCase();
          if (k === "t") {
            ui_new_doc();
            renderTabs();
          } else if (k === "w") {
            const data = JSON.parse(ui_docs_json());
            ui_close_doc(data.active);
            renderTabs();
          }
          return;
        }
        const k = e.key.toLowerCase();
        if (toolKeys[k]) setActiveTool(toolKeys[k]);
        if (e.key === "Escape") setActiveTool("select");
      });

      // boot() ran before the panel existed; sync it once now.
      lastPanelJson = null;
      applyPanel(ui_selection_panel());

      // layout probe: open index.html?diag=1 and read #status
      if (new URLSearchParams(location.search).get("diag")) {
        requestAnimationFrame(() => {
          const tb = document.querySelector(".topbar");
          const cv = document.getElementById("board");
          const r = cv.getBoundingClientRect();
          const pn = document.querySelector(".panel").getBoundingClientRect();
          document.getElementById("status").textContent =
            "DIAG win=" + innerWidth + "x" + innerHeight +
            " topbar=" + tb.scrollWidth + "/" + tb.clientWidth +
            " canvas=" + Math.round(r.width) + "x" + Math.round(r.height) +
            " panelW=" + Math.round(pn.width) +
            " dpr=" + devicePixelRatio +
            " backing=" + cv.width + "x" + cv.height;
          document.getElementById("status").classList.add("show");
        });
      }
    </script>
  </body>
</html>
